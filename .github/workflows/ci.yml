name: ci

on: [push, pull_request]

jobs:
  corpus:
    # THE QUESTION SET IS PART OF THE INSTRUMENT, so it is checked like one. This needs no memory
    # server, no npm and no network: it asks whether the corpus still satisfies the assumptions its
    # own bands rest on, and whether a defect somebody accepted has quietly been fixed or a new one
    # appeared. It runs first because it is the cheapest way for this repository to be wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the question sets must satisfy their own assumptions
        run: python validate_corpus.py --baseline=corpus-known.json

      # A NUMBER WITHOUT ITS PHRASING IS THE DEFECT THIS REPOSITORY EXISTS TO CATCH, so the two tools
      # that publish one are checked here. These read the committed results, so they cost nothing and
      # they fail the moment a table goes back to reporting a single phrasing.
      - name: every retrieval table must carry both phrasings
        run: |
          python matrix.py --report-only > /tmp/matrix.txt
          grep -q "kw h3" /tmp/matrix.txt
          grep -q "change" /tmp/matrix.txt
          echo "the matrix table carries the phrasing pair"
      - name: every published claim must be evaluable, and must print its scope
        run: |
          python claims.py
          test -s CLAIMS.md
          grep -q "claims hold in every setting measured" CLAIMS.md
          grep -q "leader-is-steady" CLAIMS.md
          grep -q "tie-means-same" CLAIMS.md
          grep -q "corpora-agree" CLAIMS.md
          grep -q "score-sees-ordering" CLAIMS.md
          grep -q "agent-agrees-with-score" CLAIMS.md
          grep -q "score-prefers-recalcitrance" CLAIMS.md
          grep -q "noise-is-charged" CLAIMS.md
          grep -q "silence-is-a-habit" CLAIMS.md
          grep -q "exam-questions-distinct" CLAIMS.md
      - name: every question must be analysed for whether it separates anybody
        run: |
          python items.py > /tmp/items.txt
          cat /tmp/items.txt
          grep -q "separate nobody" /tmp/items.txt
          grep -q "one-word trap" /tmp/items.txt
      - name: the third corpus must be one a different author wrote, and must still rank
        run: |
          python validate_corpus.py retrieval_corpus_c.json
          grep -q '"authored_by"' retrieval_corpus_c.json
          python third_corpus.py
          test -s THIRD-CORPUS.md
          grep -q "Spearman" THIRD-CORPUS.md
      - name: the corpus must report how many of its own comparisons it can settle
        run: |
          python resolution.py > /tmp/res.txt
          cat /tmp/res.txt
          grep -q "pairs separated" /tmp/res.txt
          grep -q "NOT separated from" /tmp/res.txt

      # A COUNT WITH A ZERO DENOMINATOR IS NOT A ZERO. The between-corpora table here printed "0 of 0"
      # for three phases because a two-part key was looked up in a dict keyed by three parts, and an
      # empty comparison formats exactly like a finding. This asserts the denominator is there.
      - name: a comparison with no pairs in it must not look like a result
        run: |
          if grep -q "0 of 0" RESOLUTION.md; then
            echo "RESOLUTION.md contains an empty comparison presented as a count"; exit 1
          fi
          grep -q "Between the corpora" RESOLUTION.md
          grep -q "A vs B" RESOLUTION.md

      # THE RETRIEVAL HALF OF THIS INSTRUMENT HAD NO MUTATION BATTERY. The probes have had one since
      # Addendum 19; the number the retrieval table publishes has not, so "the score measures retrieval"
      # was an assumption with a table built on top of it. This runs the four levers fast and checks that
      # the report says what the levers found, including the two things it cannot see.
      - name: the retrieval score must be mutation-tested, not assumed
        run: |
          python retrieval_mutants.py --repeat=1 --md=/tmp/rm.md > /tmp/rm.txt
          cat /tmp/rm.txt
          test -s RETRIEVAL-MUTANTS.md
          grep -q "What it cannot see" /tmp/rm.md
          grep -q "What it rewards" /tmp/rm.md
          grep -q "different verdict depending on how many results are read" /tmp/rm.md

      # THE NUMBER PUBLISHED IS NOT THE ONE A CALLER SEES. The score credits the top three; an agent
      # reads the first record. This checks that the report which puts the two side by side still runs and
      # still says both things - who leads each question, and that no subject gains under the stricter one.
      - name: the metric a caller reads must be reported beside the one published
        run: |
          python agent.py > /tmp/agent.txt
          cat /tmp/agent.txt
          test -s AGENT.md
          grep -q "What an agent actually reads" AGENT.md
          grep -q "rulers at the top" AGENT.md
          grep -q "what an agent reads" AGENT.md
          grep -q "pairs reach a different verdict" AGENT.md

      # A CORPUS WITH NO AUTHOR. The records are real package.json files and the questions are derived
      # from them by rule; the build needs node_modules and therefore runs locally, but the report reads
      # committed results and must keep running here, including its own indictment of the hard band.
      - name: the corpus with no author must still rank, and must still say what it cannot test
        run: |
          python real_corpus.py --report > /tmp/real.txt
          cat /tmp/real.txt
          test -s REAL-CORPUS.md
          grep -q "corpus with no author" REAL-CORPUS.md
          grep -q "Spearman" REAL-CORPUS.md
          grep -q "validator rejects this corpus" REAL-CORPUS.md

      # FOUR CORPORA WERE ONE AXIS. The distance sweep walks it on committed results, so it runs here:
      # the curves, the two coordinates that place each corpus, and the fact that the nearest distance
      # separates fewer pairs than the middle one.
      - name: the distance between a question and its answer must be measured, not argued about
        run: |
          python distance_sweep.py --report > /tmp/dist.txt
          cat /tmp/dist.txt
          test -s DISTANCE.md
          grep -q "How much paraphrase does a memory survive" DISTANCE.md
          grep -q "Where the four corpora sit on this axis" DISTANCE.md
          grep -q "no room" DISTANCE.md

      # THE OTHER HALF OF THE QUESTION SPACE. The distance ladder is pinned at 1.00 on the share of a
      # question the record contains; this sweep moves that second coordinate and must keep reporting the
      # subjects it separates, including the four that fall to nothing on a plural.
      - name: the vocabulary a question brings must be measured too
        run: |
          python morph_sweep.py --report > /tmp/morph.txt
          cat /tmp/morph.txt
          test -s MORPHOLOGY.md
          grep -q "Does a memory survive a plural" MORPHOLOGY.md
          grep -q "The two coordinates together" MORPHOLOGY.md

      # A QUESTION WITH THREE ANSWERS IS NOT THREE QUESTIONS. Every metric here has been single-answer;
      # this report scores required sets from the returned list the rows have always carried.
      - name: a question with more than one right answer must be scored as a set
        run: |
          python multi_query.py --report > /tmp/multi.txt
          cat /tmp/multi.txt
          test -s MULTI-RECORD.md
          grep -q "Questions with more than one right answer" MULTI-RECORD.md
          grep -q "required-set recall" MULTI-RECORD.md
          grep -q "answer every cluster in full" MULTI-RECORD.md

      # THE PRICE THE POWER ANALYSIS HAS BEEN QUOTING, PAID ONCE. Same store, five times the questions.
      - name: the price of a longer exam must be tested, not quoted
        run: |
          python exam_size.py --report > /tmp/exam.txt
          cat /tmp/exam.txt
          test -s EXAM-SIZE.md
          grep -q "five times as many questions" EXAM-SIZE.md
          grep -q "The prediction" EXAM-SIZE.md
          grep -q "not three independent draws" EXAM-SIZE.md

      # A FACT THAT CHANGED IS THE ORDINARY CASE and nothing here tested it: restart and forget cover
      # deletion, not supersession.
      - name: a superseded fact must be scored, not assumed
        run: |
          python supersede.py --report > /tmp/super.txt
          cat /tmp/super.txt
          test -s SUPERSESSION.md
          grep -q "which version of a fact is current" SUPERSESSION.md
          grep -q "current first" SUPERSESSION.md

      # A QUESTION TWO RECORDS ANSWER EQUALLY IS NOT A QUESTION. Four corpora here are generated from real
      # package descriptions, and two packages can carry the same description word for word - so the same
      # words were asked twice with a different expected record, and a subject returning the other one was
      # graded wrong for being right. The exam alone did that in 24 of its 300 slots. questions.py holds the
      # rule once; validate_corpus.py --exam checks the generated corpora for everything else it can see.
      - name: every corpus must ask each question once, and a generated corpus must still be sound
        run: |
          python questions.py
          python validate_corpus.py distance_corpus.json --exam
          python validate_corpus.py morph_corpus.json --exam
          python validate_corpus.py supersede_corpus.json --exam
          python validate_corpus.py large_corpus.json --exam --baseline=corpus-known.json

      # WHAT COMES BACK BESIDES THE ANSWER. Every table in this repository counts whether the right record
      # arrived and none counts what arrived with it, so a subject that answers more questions by handing back
      # more records has been paid for the hit and never charged for the volume. The silence bill needs no
      # classifier at all - nothing can be right on a question with no answer - and the panel is where the new
      # axis has to move a verdict that already existed, or it is decoration.
      - name: what comes back besides the answer must be priced, and the exam must be checked
        run: |
          python precision.py > /tmp/precision.txt
          cat /tmp/precision.txt
          test -s PRECISION.md
          grep -q "The silence bill" PRECISION.md
          grep -q "Does the score charge for this" PRECISION.md
          grep -q "A checker and a subject that share one idea" PRECISION.md
          # THE EXAM HAD NEVER BEEN VALIDATED. --exam relaxes the three rules an exam legitimately breaks and
          # nothing else, so a NEW defect in its questions fails here while the pinned ones do not.
          python validate_corpus.py large_corpus.json --exam --baseline=corpus-known.json | tee /tmp/exam-check.txt
          grep -q "pinned defect(s)" /tmp/exam-check.txt

      - name: a tie must be reported as one of its three kinds, with a price
        run: |
          python band.py > /tmp/band.txt
          cat /tmp/band.txt
          test -s BAND.md
          grep -q "What kinds of tie there are" BAND.md
          grep -q "SMALL BUT REAL" BAND.md
          grep -q "would need" BAND.md
          grep -q "rulers at the top" BAND.md
      - name: a paired test must say when the twelve-point switch decides it
        run: |
          python compare.py zenbrain control > /tmp/pair.txt
          cat /tmp/pair.txt
          grep -q "without the 12 unanswerable questions" /tmp/pair.txt
          grep -q "THE TWELVE-POINT SWITCH DECIDES THIS ONE" /tmp/pair.txt
      - name: a paired claim must say when the phrasing decides it
        run: |
          python compare.py memory-mcp-1file zenbrain > /tmp/cmp.txt
          cat /tmp/cmp.txt
          grep -q "as written" /tmp/cmp.txt
          grep -q "as keywords" /tmp/cmp.txt
          grep -q "THE PHRASING DECIDES THIS ONE" /tmp/cmp.txt

  mutants:
    # DOES THE INSTRUMENT WORK. Two questions, both about the harness rather than about any subject.
    #
    # The probe job below shows three real subjects passing and failing. The first step here shows that
    # every probe CAN fail, by running the control with exactly one promise broken and comparing
    # against the verdicts written down before the run. The second shows that the retrieval scale has a
    # reachable ceiling and a floor that is not zero, because "42 out of 60" means nothing until both
    # ends of the scale have been measured.
    #
    # Neither step needs npm or the network, and together they take about a minute. They are the only
    # checks here that would notice an instrument quietly losing the ability to tell subjects apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: every probe must be failed by the subject built to break it
        run: python mutants.py
      - name: the generated table must match the run
        run: |
          test -s MUTANTS.md
          grep -q "on its own" MUTANTS.md
          grep -q "Every predicted verdict matched" MUTANTS.md
      # A SMOKE TEST, NOT A MEASUREMENT. The full sweep is twenty minutes and belongs on a machine
      # that is not billing by the minute; this checks that the tool runs, that it reports a depth
      # series, and that the committed table exists. The first version swept all eleven subjects and
      # was still running at nineteen minutes when it was cancelled - a check nobody waits for is a
      # check that gets removed.
      - name: the cost of a search must be measured at a depth, not at a corpus
        run: |
          python growth.py --only=control --max=100 --no-save > /tmp/grow.txt
          cat /tmp/grow.txt
          grep -q "cost per write" /tmp/grow.txt
          test -s GROWTH.md
          grep -q "Searches at depth" GROWTH.md
      - name: the retrieval scale must have a measured ceiling and a non-zero floor
        run: |
          python calibration.py --repeat=1 > /tmp/cal.txt
          cat /tmp/cal.txt
          grep -q "score 60 and 60" /tmp/cal.txt
          grep -q "score 12 and 12" /tmp/cal.txt

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # THIS JOB PROBES THREE SERVERS AND NONE OF THEM IS AN OPTIONAL SUBJECT. The seventeen other
      # memory servers this repository measures are declared as optionalDependencies, because several
      # of them build native extensions and one of those (better-sqlite3, via node-gyp 8) cannot build
      # under Python 3.12 at all - distutils was removed. Installing them here proved nothing about
      # the harness and broke the build; --omit=optional keeps the job to what it actually tests and
      # leaves local runs free to install every subject.
      - run: npm ci --omit=optional
      - name: probe the reference memory server
        run: |
          python harness.py --cmd="node node_modules/@modelcontextprotocol/server-memory/dist/index.js" \
            --json=report.json --expect=expected.json || true
          cat report.json
      - name: the positive control must pass every probe
        run: |
          python harness.py --adapter=control \
            --cmd="python control/memory_server.py" --expect=expected-control.json

      # A PIN IS A REGRESSION DETECTOR, NOT AN ALL-PASS ASSERTION. retained is pinned with one known
      # failure: a record from another tool with no seq field makes it refuse every later write, so
      # foreign_record is FAIL. It was previously pinned PASS because the client swallowed the isError
      # flag and counted a refusal as an acknowledgement. The pin now records what the subject does.
      - name: probe retained (pinned, including its one known refusal)
        run: |
          git clone --depth 1 https://github.com/arm00pv/retained /tmp/retained
          python harness.py --adapter=retained --cmd="python /tmp/retained/retained.py" \
            --expect=expected-retained.json --per-writer=25

      - name: verdicts must match the pinned expectation
        run: |
          python - <<'PY'
          import json, sys
          want = json.load(open('expected.json'))
          got = {r['probe']: r['verdict'] for r in json.load(open('report.json'))['probes']}
          drift = {k: (v, got.get(k)) for k, v in want.items() if got.get(k) != v}
          print('drift:', drift or 'none')
          sys.exit(1 if drift else 0)
          PY