name: ci

on: [push, pull_request]

jobs:
  corpus:
    # THE QUESTION SET IS PART OF THE INSTRUMENT, so it is checked like one. This needs no memory
    # server, no npm and no network: it asks whether the corpus still satisfies the assumptions its
    # own bands rest on, and whether a defect somebody accepted has quietly been fixed or a new one
    # appeared. It runs first because it is the cheapest way for this repository to be wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the question sets must satisfy their own assumptions
        run: python validate_corpus.py --baseline=corpus-known.json

      # A NUMBER WITHOUT ITS PHRASING IS THE DEFECT THIS REPOSITORY EXISTS TO CATCH, so the two tools
      # that publish one are checked here. These read the committed results, so they cost nothing and
      # they fail the moment a table goes back to reporting a single phrasing.
      # A TABLE SYNCED BY A TOOL IS ONLY SYNCED WHERE THE TOOL LOOKS. Splitting the README into pages moved
      # the live matrix block to docs/subjects.md and this script, which searched only README.md, stopped
      # finding it - the split proved that a sync tool hard-coding one location guarantees the others drift.
      - name: the live matrix block must be found and refilled, wherever it lives
        run: python sync_readme.py

      # A LINK TO A PAGE THAT DOES NOT EXIST IS THE CHEAPEST BROKEN DOCUMENT THERE IS, and the README was
      # split into five pages at once. Fenced code is stripped first: a link inside an example is an example.
      - name: a page must not link to a page that does not exist
        run: |
          python - <<'PY'
          import io, os, re, sys
          FENCE = chr(96) * 3
          files = ['README.md', 'QUICKSTART.md'] + ['docs/' + f for f in sorted(os.listdir('docs'))]
          bad = []
          for name in files:
              base = os.path.dirname(name) or '.'
              with io.open(name, encoding='utf-8') as fh:
                  text = fh.read()
              text = re.sub(re.escape(FENCE) + r'.*?' + re.escape(FENCE), '', text, flags=re.S)
              for m in re.finditer(r'\[[^\]\n]+\]\(([^)\n]+)\)', text):
                  target = m.group(1).split('#')[0].strip()
                  if target and not target.startswith(('http', 'mailto')):
                      path = os.path.normpath(os.path.join(base, target))
                      if not os.path.exists(path):
                          bad.append('%s -> %s' % (name, target))
          print('%d pages checked' % len(files))
          if bad:
              print(chr(10).join(bad))
              sys.exit(1)
          PY

      - name: every retrieval table must carry both phrasings
        run: |
          python matrix.py --report-only > /tmp/matrix.txt
          grep -q "kw h3" /tmp/matrix.txt
          grep -q "change" /tmp/matrix.txt
          echo "the matrix table carries the phrasing pair"
      - name: every published claim must be evaluable, and must print its scope
        run: |
          python claims.py
          test -s CLAIMS.md
          grep -q "claims hold in every setting measured" CLAIMS.md
          grep -q "leader-is-steady" CLAIMS.md
          grep -q "tie-means-same" CLAIMS.md
          grep -q "corpora-agree" CLAIMS.md
          grep -q "score-sees-ordering" CLAIMS.md
          grep -q "agent-agrees-with-score" CLAIMS.md
          grep -q "score-prefers-recalcitrance" CLAIMS.md
          grep -q "noise-is-charged" CLAIMS.md
          grep -q "padding-is-free" CLAIMS.md
          grep -q "silence-is-a-habit" CLAIMS.md
          grep -q "exam-questions-distinct" CLAIMS.md
          grep -q "rule-reads-like-a-reader" CLAIMS.md
          grep -q "readers-agree-with-each-other" CLAIMS.md
      - name: every question must be analysed for whether it separates anybody
        run: |
          python items.py > /tmp/items.txt
          cat /tmp/items.txt
          grep -q "separate nobody" /tmp/items.txt
          grep -q "one-word trap" /tmp/items.txt
      - name: the third corpus must be one a different author wrote, and must still rank
        run: |
          python validate_corpus.py retrieval_corpus_c.json
          grep -q '"authored_by"' retrieval_corpus_c.json
          python third_corpus.py
          test -s THIRD-CORPUS.md
          grep -q "Spearman" THIRD-CORPUS.md
      - name: the corpus must report how many of its own comparisons it can settle
        run: |
          python resolution.py > /tmp/res.txt
          cat /tmp/res.txt
          grep -q "pairs separated" /tmp/res.txt
          grep -q "NOT separated from" /tmp/res.txt

      # A COUNT WITH A ZERO DENOMINATOR IS NOT A ZERO. The between-corpora table here printed "0 of 0"
      # for three phases because a two-part key was looked up in a dict keyed by three parts, and an
      # empty comparison formats exactly like a finding. This asserts the denominator is there.
      - name: a comparison with no pairs in it must not look like a result
        run: |
          if grep -q "0 of 0" RESOLUTION.md; then
            echo "RESOLUTION.md contains an empty comparison presented as a count"; exit 1
          fi
          grep -q "Between the corpora" RESOLUTION.md
          grep -q "A vs B" RESOLUTION.md

      # THE RETRIEVAL HALF OF THIS INSTRUMENT HAD NO MUTATION BATTERY. The probes have had one since
      # Addendum 19; the number the retrieval table publishes has not, so "the score measures retrieval"
      # was an assumption with a table built on top of it. This runs the four levers fast and checks that
      # the report says what the levers found, including the two things it cannot see.
      - name: the retrieval score must be mutation-tested, not assumed
        run: |
          python retrieval_mutants.py --repeat=1 --md=/tmp/rm.md > /tmp/rm.txt
          cat /tmp/rm.txt
          test -s RETRIEVAL-MUTANTS.md
          grep -q "What it cannot see" /tmp/rm.md
          grep -q "What it rewards" /tmp/rm.md
          grep -q "different verdict depending on how many results are read" /tmp/rm.md

      # THE NUMBER PUBLISHED IS NOT THE ONE A CALLER SEES. The score credits the top three; an agent
      # reads the first record. This checks that the report which puts the two side by side still runs and
      # still says both things - who leads each question, and that no subject gains under the stricter one.
      - name: the metric a caller reads must be reported beside the one published
        run: |
          python agent.py > /tmp/agent.txt
          cat /tmp/agent.txt
          test -s AGENT.md
          grep -q "What an agent actually reads" AGENT.md
          grep -q "rulers at the top" AGENT.md
          grep -q "what an agent reads" AGENT.md
          grep -q "pairs reach a different verdict" AGENT.md

      # A CORPUS WITH NO AUTHOR. The records are real package.json files and the questions are derived
      # from them by rule; the build needs node_modules and therefore runs locally, but the report reads
      # committed results and must keep running here, including its own indictment of the hard band.
      - name: the corpus with no author must still rank, and must still say what it cannot test
        run: |
          python real_corpus.py --report > /tmp/real.txt
          cat /tmp/real.txt
          test -s REAL-CORPUS.md
          grep -q "corpus with no author" REAL-CORPUS.md
          grep -q "Spearman" REAL-CORPUS.md
          grep -q "validator rejects this corpus" REAL-CORPUS.md

      # FOUR CORPORA WERE ONE AXIS. The distance sweep walks it on committed results, so it runs here:
      # the curves, the two coordinates that place each corpus, and the fact that the nearest distance
      # separates fewer pairs than the middle one.
      - name: the distance between a question and its answer must be measured, not argued about
        run: |
          python distance_sweep.py --report > /tmp/dist.txt
          cat /tmp/dist.txt
          test -s DISTANCE.md
          grep -q "How much paraphrase does a memory survive" DISTANCE.md
          grep -q "Where the four corpora sit on this axis" DISTANCE.md
          grep -q "no room" DISTANCE.md

      # THE OTHER HALF OF THE QUESTION SPACE. The distance ladder is pinned at 1.00 on the share of a
      # question the record contains; this sweep moves that second coordinate and must keep reporting the
      # subjects it separates, including the four that fall to nothing on a plural.
      - name: the vocabulary a question brings must be measured too
        run: |
          python morph_sweep.py --report > /tmp/morph.txt
          cat /tmp/morph.txt
          test -s MORPHOLOGY.md
          grep -q "Does a memory survive a plural" MORPHOLOGY.md
          grep -q "The two coordinates together" MORPHOLOGY.md

      # A QUESTION WITH THREE ANSWERS IS NOT THREE QUESTIONS. Every metric here has been single-answer;
      # this report scores required sets from the returned list the rows have always carried.
      - name: a question with more than one right answer must be scored as a set
        run: |
          python multi_query.py --report > /tmp/multi.txt
          cat /tmp/multi.txt
          test -s MULTI-RECORD.md
          grep -q "Questions with more than one right answer" MULTI-RECORD.md
          grep -q "required-set recall" MULTI-RECORD.md
          grep -q "answer every cluster in full" MULTI-RECORD.md

      # THE PRICE THE POWER ANALYSIS HAS BEEN QUOTING, PAID ONCE. Same store, five times the questions.
      - name: the price of a longer exam must be tested, not quoted
        run: |
          python exam_size.py --report > /tmp/exam.txt
          cat /tmp/exam.txt
          test -s EXAM-SIZE.md
          grep -q "several times as many questions" EXAM-SIZE.md
          grep -q "The prediction" EXAM-SIZE.md
          grep -q "not three independent draws" EXAM-SIZE.md

      # A FACT THAT CHANGED IS THE ORDINARY CASE and nothing here tested it: restart and forget cover
      # deletion, not supersession.
      - name: a superseded fact must be scored, not assumed
        run: |
          python supersede.py --report > /tmp/super.txt
          cat /tmp/super.txt
          test -s SUPERSESSION.md
          grep -q "which version of a fact is current" SUPERSESSION.md
          grep -q "current first" SUPERSESSION.md

      # THE ONE ARTIFACT A PERSON CAN SPOIL BY FILLING IT IN. This step used to re-export the sample
      # inside the guard, so the first commit carrying sixty answers would have been rewritten to sixty
      # blanks and then failed on the diff - the questionnaire could be handed out and never returned.
      # It checks the draw now instead of rewriting it, and the answers are allowed to be there, which is
      # also what makes the plants below possible: a filled verdict is the normal case, not the failure.
      - name: the sample a person reads must still be the draw it was, and must refuse to eat an answer
        run: |
          python judge.py --check-sample | tee /tmp/sample.txt
          grep -q "still the draw it was" /tmp/sample.txt
          grep -q "with an answer among them" /tmp/sample.txt
          echo "1. the sample is the committed draw, and there is something on both sides to read"
          # A VERDICT A PERSON COULD NOT HAVE WRITTEN. Anything but YES, NO or blank is imported as a
          # pair left blank, which is how a typo in the answers file quietly becomes a shorter sample.
          python - <<'PY'
          import io
          p = 'results/human-sample.json'
          text = io.open(p, encoding='utf-8').read()
          io.open(p, 'w', encoding='utf-8', newline=chr(10)).write(
              text.replace('"verdict": ""', '"verdict": "MAYBE"', 1))
          print('planted a verdict of MAYBE on the first pair')
          PY
          if python judge.py --check-sample > /tmp/planted.txt; then
            cat /tmp/planted.txt
            echo "the sample check passed a verdict nobody could have written"
            git checkout -- results/human-sample.json
            exit 1
          fi
          grep -q "carries a verdict of 'MAYBE'" /tmp/planted.txt
          echo "2. it refused the verdict, and named the pair and the word"
          git checkout -- results/human-sample.json
          # THE PAGE AND THE KEY ARE THE SAME FILE, so an edit to what is shown would otherwise pass
          # every check above: the record the person reads is also the record being scored against.
          python - <<'PY'
          import io
          p = 'results/human-sample.json'
          text = io.open(p, encoding='utf-8').read()
          io.open(p, 'w', encoding='utf-8', newline=chr(10)).write(
              text.replace('"shown": "', '"shown": "One ', 1))
          print('edited the first record a person is shown')
          PY
          if python judge.py --check-sample > /tmp/moved.txt; then
            cat /tmp/moved.txt
            echo "the sample check passed a record that is not the one drawn"
            git checkout -- results/human-sample.json
            exit 1
          fi
          grep -q "the record shown changed" /tmp/moved.txt
          echo "3. it refused the edited record"
          git checkout -- results/human-sample.json
          # AND THE EXPORT MUST NOT EAT THEM. Sixty answers are the only evidence in this repository
          # that cannot be produced again by running something, so a redraw refuses and says what to move.
          python - <<'PY'
          import io
          p = 'results/human-sample.json'
          text = io.open(p, encoding='utf-8').read()
          io.open(p, 'w', encoding='utf-8', newline=chr(10)).write(
              text.replace('"verdict": ""', '"verdict": "YES"', 1))
          print('filled in one answer')
          PY
          if python judge.py --export-human=60 > /tmp/redraw.txt 2>&1; then
            cat /tmp/redraw.txt
            echo "the export replaced a file that holds a person's answer"
            git checkout -- results/human-sample.json results/human-sample.md
            exit 1
          fi
          cat /tmp/redraw.txt
          grep -q "already holds 1 of a person's answers" /tmp/redraw.txt
          echo "4. a new draw refused to replace an answer"
          git checkout -- results/human-sample.json results/human-sample.md
          git diff --exit-code results
          echo "5. the sample files are back to what is committed"

      # THE RETURN PATH HAD NEVER BEEN RUN. Every check above proves the questionnaire can be handed
      # out; nothing proved that sixty answers coming back render at all. `import_human` stores them
      # under "random" and the report has a section for that which had only ever run on an empty
      # file - and this is the section that crashed the report once, when it read the probe's own
      # sentence about how its six pairs were chosen as though it were a dict of labels.
      # AND THE ARITHMETIC IS CHECKED AGAINST ITSELF. A person who says YES to everything agrees with
      # the rule exactly on the pairs the rule calls relevant, and one who says NO to everything agrees
      # on the rest, so the two counts must add to sixty - they do, 32 and 28. Both of those score
      # kappa 0.00, while a person who reads the way the rule does scores 0.67, so the number carries
      # information the agreement rate does not. Neither of the one-word readers is evidence about a
      # person; they are here to fail if the agreement line ever starts reading one side twice.
      - name: sixty answers coming back must render, and the two one-word readers must score zero
        run: |
          python - <<'PY'
          import io, json
          doc = json.load(io.open('results/human-sample.json', encoding='utf-8'))
          for how, fixed in (('faithful', None), ('all-yes', 'YES'), ('all-no', 'NO')):
              copy = json.loads(json.dumps(doc))
              for l in copy['labels']:
                  l['verdict'] = fixed or ('YES' if l['kind'] == 'answer' else 'NO')
              io.open('/tmp/filled-%s.json' % how, 'w', encoding='utf-8',
                      newline=chr(10)).write(json.dumps(copy, ensure_ascii=False, indent=1) + chr(10))
          print('wrote three answers files from the committed sample')
          PY
          for how in faithful all-yes all-no; do
            python judge.py --import-human=/tmp/filled-$how.json | tee /tmp/import.txt
            grep -q '60 verdict(s) imported; 0 left blank' /tmp/import.txt
            python judge.py --report > /dev/null
            grep -q '## A person, on a random draw' JUDGE.md
            grep -q 'drawn at random' JUDGE.md
            case $how in
              faithful) want='50 of 60 (83%), kappa 0.67' ;;
              all-yes)  want='32 of 60 (53%), kappa 0.00' ;;
              all-no)   want='28 of 60 (47%), kappa 0.00' ;;
            esac
            if ! grep -qF "Agreement with the rule's reading of relevance: **$want**" JUDGE.md; then
              grep -o "Agreement with the rule's reading of relevance: [^*]*" JUDGE.md
              echo "the report does not say: $want"
              git checkout -- results/human.json results/human-sample.json JUDGE.md
              exit 1
            fi
            echo "$how: rendered, and the agreement line is the one that reading implies"
          done
          git checkout -- results/human.json results/human-sample.json JUDGE.md
          git diff --exit-code results JUDGE.md
          echo 'the repository is back to the answers it actually holds'

      # EVERY REPORT HERE SAYS "Generated by X. Do not edit by hand" AND NOTHING CHECKED IT. This regenerates
      # every one of them from the committed results and fails if a byte moved. It was written because two of
      # them HAD moved: REAL-CORPUS.md still carried the numbers from before one subject was re-measured, and
      # GROWTH.md's own title said 500 records beside five-thousand-record data, which was a bug in the report
      # mode rather than in the table. Only report modes are run here - anything that would re-measure a
      # subject belongs in its own job, and a check that edits the evidence it is checking is not a check.
      # The three without a report mode - calibration.py, retrieval_mutants.py and mutants.py - have one now,
      # so the tables describing the scale, the mutants and the probes are covered by the same rule.
      - name: the generated reports must match their generators
        run: |
          python matrix.py --report-only > /dev/null
          python sync_readme.py > /dev/null
          python resolution.py > /dev/null
          python band.py > /dev/null
          python agent.py > /dev/null
          python items.py > /dev/null
          # THE ONE DOCUMENT THIS LIST NEVER CARRIED. THIRD-CORPUS.md is generated from committed results
          # like the rest, and for four phases nothing re-ran it - guard_cover.py below is the check that
          # found it, and it is here now so the list and the documents agree.
          python third_corpus.py > /dev/null
          # A DAMAGED STORE, RENDERED FROM WHAT WAS RECORDED WHEN IT WAS DAMAGED. durability.py --report
          # reads results/durability.json and launches nothing; the damage itself happened once, on one
          # machine, and re-taking it here would be re-measuring a subject inside a check.
          python durability.py --report > /dev/null
          python real_corpus.py --report > /dev/null
          python distance_sweep.py --report > /dev/null
          python morph_sweep.py --report > /dev/null
          python multi_query.py --report > /dev/null
          python supersede.py --report > /dev/null
          python exam_size.py > /dev/null
          python precision.py > /dev/null
          python judge.py --report > /dev/null
          python growth.py --report-only > /dev/null
          python calibration.py --report > /dev/null
          python retrieval_mutants.py --report > /dev/null
          python mutants.py --report > /dev/null
          python claims.py > /dev/null
          git diff --stat
          git diff --exit-code

      # A TRANSCRIPT IS A CLAIM ABOUT WHAT A COMMAND PRINTS. docs/cost.md carried a copy of the cost
      # table - nine rows where the results held eleven, and a sentence that counted "two" subjects at
      # 39 bytes where there are three - because sync_readme filled the first matrix block it found and
      # this one was never filled. Both blocks are generated from the command they name now, and this
      # asserts they are still there so the next page cannot quietly go back to being a copy.
      - name: every command transcript in the pages must be generated from the command it names
        run: |
          grep -q "python matrix.py --cost-only --report-only" docs/cost.md
          grep -q "mcp-duckdb-memory-server 1.1.10" docs/cost.md
          grep -q "python matrix.py$" docs/subjects.md
          echo "both transcripts name a report-only command and carry the measured rows"
      # AND NOTHING CHECKED THAT THE LIST ABOVE WAS COMPLETE. A generator added later would write a
      # document with the same "Do not edit by hand" sentence, never be re-run, and pass every check
      # in this file. This reads the claim out of each document and the guard out of this workflow and
      # fails when a generated document is not in the list - which is how THIRD-CORPUS.md was found.
      - name: every document that claims a generator must be re-run, and this check must be able to fail
        run: |
          # EVERY SILENT STEP IS FOLLOWED BY A LINE THAT SAYS IT RAN. The first version of this step failed
          # on the runner and the log ended at a line that had succeeded, because the commands after it
          # print nothing when they work - so the failure could have been any one of four. A check that
          # cannot say which of its own commands failed is the same species of thing it was written to
          # catch, and it gets the same fix: name the steps.
          python guard_cover.py | tee /tmp/cover.txt
          grep -q "0 documents are outside the guard" /tmp/cover.txt
          grep -q "every generated document is re-run" /tmp/cover.txt
          echo "1. the guard covers every generated document"
          # SINGLE QUOTES, BECAUSE A DOUBLE-QUOTED BACKTICK IS A COMMAND. The argument above reads as
          # a page naming a tool; written with double quotes it reads as "run nothing.py and paste
          # whatever comes back", which is how the first version of this step planted a page with no
          # generator in it and then reported that the coverage check had passed it.
          printf '%s\n' '# planted' '' 'Generated by `nothing.py`. Do not edit by hand.' > docs/_plant.md
          echo "2. planted a page naming a generator that does not exist"
          if python guard_cover.py > /tmp/plant.txt; then
            cat /tmp/plant.txt
            echo "the coverage check passed a document with no generator in the guard"
            exit 1
          fi
          cat /tmp/plant.txt
          echo "3. it refused the planted page"
          grep -q "docs/_plant.md" /tmp/plant.txt
          rm docs/_plant.md
          echo "4. removed the plant"
          cat > /tmp/stale.yml <<'YAML'
          jobs:
            x:
              steps:
                - name: the generated reports must match their generators
                  run: |
                    python claims.py > /dev/null
                    python nothing.py > /dev/null
                    python matrix.py --report-only > /dev/null
                    python sync_readme.py > /dev/null
                    git diff --exit-code
          YAML
          echo "5. wrote a workflow whose guard re-runs a tool that generates nothing"
          if python guard_cover.py --workflow=/tmp/stale.yml > /tmp/stale.txt; then
            cat /tmp/stale.txt
            echo "the coverage check passed a guard line that regenerates nothing"
            exit 1
          fi
          cat /tmp/stale.txt
          echo "6. it refused the stale guard line"
          # THE PATTERN IS THE MESSAGE. It first read "regenerating nothing", which is one letter group
          # more than the line it was looking for ("generating nothing") and could never have matched -
          # so this step failed on the runner while the check it was testing had worked perfectly.
          grep -q "generating nothing: nothing.py" /tmp/stale.txt
          echo "7. and named it"
          git diff --exit-code docs

      # COVERAGE IS NOT FRESHNESS. Every generated page is re-run above, so a table cannot drift - but
      # the prose quotes figures in sentences and nothing re-derived them. docs/precision.md carried a
      # hand-copied table that said memento answers 326 questions where the results say 294, and 147
      # unanswerable questions where the band holds 146; nothing anywhere would have noticed. figures.py
      # makes each sentence a pin: the words are read out of the file and the numbers recomputed.
      - name: every number a hand-written page quotes must match the results, and this check must be able to fail
        run: |
          python figures.py | tee /tmp/figures.txt
          grep -q "every number a hand-written page quotes still matches" /tmp/figures.txt
          echo "1. the numbers in the hand-written pages agree with the results"
          # AND IT HAS TO BE ABLE TO FAIL. Move one number in the README by one, require the check to
          # refuse it by name, and put the file back. If the sentence itself has been reworded the sed
          # changes nothing, the check passes, and this step fails - which is also what should happen.
          sed -i 's/from 37 to \*\*43\*\*/from 38 to **43**/' README.md
          if python figures.py > /tmp/planted.txt; then
            cat /tmp/planted.txt
            echo "the number check passed a sentence that disagrees with its results"
            git checkout -- README.md
            exit 1
          fi
          cat /tmp/planted.txt
          grep -q "DISAGREES" /tmp/planted.txt
          grep -q "control.score.A" /tmp/planted.txt
          echo "2. it refused the moved number and named it"
          git checkout -- README.md
          git diff --exit-code README.md

      # A TOOL IN THIS DIRECTORY SHADOWS THE STANDARD LIBRARY FOR EVERY OTHER TOOL IN IT. The check above
      # was called numbers.py for one commit, which replaced the stdlib module of that name inside every
      # script here: claims.py quietly turned search-is-flat from FAILS into UNMEASURED with "module
      # numbers has no attribute Rational", and the ledger would have lost a claim for a reason that had
      # nothing to do with any subject. Nothing was looking for that, and nothing would have found it
      # except the regenerated CLAIMS.md happening to appear in a diff.
      # THE MORNING AFTER. Every other table here describes a working server; this one is what a
      # subject does when a file it kept its records in is damaged. It is the only measurement in the
      # repository that damages the evidence rather than reading it, so it gets its own assertions.
      - name: a damaged store must be recorded, and the table must say what it found
        run: |
          python durability.py --report
          grep -q "What a damaged store costs" DURABILITY.md
          grep -q "A trailing fragment is survivable and a missing tail is not" DURABILITY.md
          grep -q "no store file" DURABILITY.md
          grep -q "started, could not read" DURABILITY.md
          echo "the durability table is present and carries its four outcomes"

      - name: no file in this repository may shadow a standard library module
        run: |
          python - <<'PY'
          import os, sys
          here = sorted(p for p in os.listdir(".") if p.endswith(".py"))
          names = sorted(set(p[:-3] for p in here) & set(sys.stdlib_module_names))
          print("%d python files in this directory" % len(here))
          if names:
              print("these shadow a standard library module: " + ", ".join(names))
              raise SystemExit(1)
          print("no file here shadows a standard library module")
          PY
      # A QUESTION TWO RECORDS ANSWER EQUALLY IS NOT A QUESTION. Four corpora here are generated from real
      # package descriptions, and two packages can carry the same description word for word - so the same
      # words were asked twice with a different expected record, and a subject returning the other one was
      # graded wrong for being right. The exam alone did that in 24 of its 300 slots. questions.py holds the
      # rule once; validate_corpus.py --exam checks the generated corpora for everything else it can see.
      # A CHECK THAT CANNOT FAIL IS NOT A CHECK. The absent-band rule now charges only a question that is a
      # record in disguise, and no corpus here contains one - nine corpora, zero copies - so the rule has
      # never been seen firing. This plants a record's own text as an absent question and requires it.
      - name: the unlabelled-answer check must be able to fail
        run: |
          python - <<'PY'
          import io, json, subprocess, sys
          base = json.load(io.open('retrieval_corpus_b.json', encoding='utf-8'))
          record = base['records'][0]
          queries, done = [], False
          for q in base['queries']:
              if q.get('difficulty') == 'absent' and not done:
                  queries.append({'query': record['text'], 'expect': None, 'difficulty': 'absent'})
                  done = True
              else:
                  queries.append(q)
          doc = dict(base)
          doc['queries'] = queries
          io.open('/tmp/planted.json', 'w', encoding='utf-8').write(json.dumps(doc, ensure_ascii=False, indent=1))
          out = subprocess.run([sys.executable, 'validate_corpus.py', '/tmp/planted.json'],
                               capture_output=True, text=True).stdout
          hits = [l for l in out.splitlines() if 'disguise' in l]
          print(chr(10).join(hits) or 'no charge raised')
          if len(hits) != 1:
              sys.exit('the unlabelled-answer rule did not fire on a planted record')
          PY

      - name: every corpus must ask each question once, and a generated corpus must still be sound
        run: |
          python questions.py
          python validate_corpus.py distance_corpus.json --exam
          python validate_corpus.py morph_corpus.json --exam
          python validate_corpus.py supersede_corpus.json --exam
          python validate_corpus.py large_corpus.json --exam --baseline=corpus-known.json

      # WHAT COMES BACK BESIDES THE ANSWER. Every table in this repository counts whether the right record
      # arrived and none counts what arrived with it, so a subject that answers more questions by handing back
      # more records has been paid for the hit and never charged for the volume. The silence bill needs no
      # classifier at all - nothing can be right on a question with no answer - and the panel is where the new
      # axis has to move a verdict that already existed, or it is decoration.
      - name: what comes back besides the answer must be priced, and the exam must be checked
        run: |
          python precision.py > /tmp/precision.txt
          cat /tmp/precision.txt
          test -s PRECISION.md
          grep -q "The silence bill" PRECISION.md
          grep -q "Does the score charge for this" PRECISION.md
          grep -q "Does the reading move when a subject pads" PRECISION.md
          grep -q "share one idea cannot check each other" PRECISION.md
          # A LEVER HAS TO MOVE THE THING IT IS NAMED AFTER. Both padding levers keep the control's top three
          # and append two records; the section says what the classifier made of those appended records. On
          # the near lever it is 66 of 607, which is the defect that explains the one failing check - and it
          # is the sort of number that quietly disappears when a report is rewritten, so it is pinned here.
          grep -q "Does the padding do what its name says" PRECISION.md
          grep -q "lands in the near class" PRECISION.md
          # THE EXAM HAD NEVER BEEN VALIDATED. --exam relaxes the three rules an exam legitimately breaks and
          # nothing else, so a new defect in its questions fails here. It has no pinned defects left: the
          # twelve duplicated questions were dropped at build time and the eight "unlabelled answers" turned
          # out to be word-overlap alarms, so the rule that charged them has been split in two instead.
          python validate_corpus.py large_corpus.json --exam | tee /tmp/exam-check.txt
          grep -q "0 of 1 corpus file(s) failed" /tmp/exam-check.txt

      # ONE JUDGE, ONE READING, AND IT HAPPENS TO BE A MODEL. Every label in the precision reading comes from
      # a rule about words; judge.py asks a model whether each returned record would help the person who
      # asked, and compares. The judgments are cached and committed, so this step needs no model, no network
      # and no key - it re-derives the agreement from the cache the same way every other report here does.
      - name: the second opinion must be recomputable without the judge
        run: |
          python judge.py --report
          test -s JUDGE.md
          grep -q "Cohen's kappa" JUDGE.md
          grep -q "Calibration" JUDGE.md
          grep -q "A person, as the third labeller" JUDGE.md
          grep -q "readers-match-a-person" CLAIMS.md
          # THE READERS ARE THE ONE LABELLER THAT CAN BE ASKED TWICE. The section compares what a reader
          # says about a pair with what it said the first time, which is the only measurement here of the
          # instrument on itself rather than of one labeller against another - and a report that quietly
          # drops it would leave the ceiling of 0.81 unexplained.
          grep -q "The same reader, asked twice" JUDGE.md
          grep -q "a-reader-is-steady" CLAIMS.md

      - name: a tie must be reported as one of its three kinds, with a price
        run: |
          python band.py > /tmp/band.txt
          cat /tmp/band.txt
          test -s BAND.md
          grep -q "What kinds of tie there are" BAND.md
          grep -q "SMALL BUT REAL" BAND.md
          grep -q "would need" BAND.md
          grep -q "rulers at the top" BAND.md
      - name: a paired test must say when the twelve-point switch decides it
        run: |
          python compare.py zenbrain control > /tmp/pair.txt
          cat /tmp/pair.txt
          grep -q "without the 12 unanswerable questions" /tmp/pair.txt
          grep -q "THE TWELVE-POINT SWITCH DECIDES THIS ONE" /tmp/pair.txt
      - name: a paired claim must say when the phrasing decides it
        run: |
          python compare.py memory-mcp-1file zenbrain > /tmp/cmp.txt
          cat /tmp/cmp.txt
          grep -q "as written" /tmp/cmp.txt
          grep -q "as keywords" /tmp/cmp.txt
          grep -q "THE PHRASING DECIDES THIS ONE" /tmp/cmp.txt

  mutants:
    # DOES THE INSTRUMENT WORK. Two questions, both about the harness rather than about any subject.
    #
    # The probe job below shows three real subjects passing and failing. The first step here shows that
    # every probe CAN fail, by running the control with exactly one promise broken and comparing
    # against the verdicts written down before the run. The second shows that the retrieval scale has a
    # reachable ceiling and a floor that is not zero, because "42 out of 60" means nothing until both
    # ends of the scale have been measured.
    #
    # Neither step needs npm or the network, and together they take about a minute. They are the only
    # checks here that would notice an instrument quietly losing the ability to tell subjects apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: every probe must be failed by the subject built to break it
        run: python mutants.py
      - name: the generated table must match the run
        run: |
          test -s MUTANTS.md
          grep -q "on its own" MUTANTS.md
          grep -q "Every predicted verdict matched" MUTANTS.md
      # A SMOKE TEST, NOT A MEASUREMENT. The full sweep is twenty minutes and belongs on a machine
      # that is not billing by the minute; this checks that the tool runs, that it reports a depth
      # series, and that the committed table exists. The first version swept all eleven subjects and
      # was still running at nineteen minutes when it was cancelled - a check nobody waits for is a
      # check that gets removed.
      - name: the cost of a search must be measured at a depth, not at a corpus
        run: |
          python growth.py --only=control --max=100 --no-save > /tmp/grow.txt
          cat /tmp/grow.txt
          grep -q "cost per write" /tmp/grow.txt
          test -s GROWTH.md
          grep -q "Searches at depth" GROWTH.md
      - name: the retrieval scale must have a measured ceiling and a non-zero floor
        run: |
          python calibration.py --repeat=1 > /tmp/cal.txt
          cat /tmp/cal.txt
          grep -q "score 60 and 60" /tmp/cal.txt
          grep -q "score 12 and 12" /tmp/cal.txt

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # THIS JOB PROBES THREE SERVERS AND NONE OF THEM IS AN OPTIONAL SUBJECT. The seventeen other
      # memory servers this repository measures are declared as optionalDependencies, because several
      # of them build native extensions and one of those (better-sqlite3, via node-gyp 8) cannot build
      # under Python 3.12 at all - distutils was removed. Installing them here proved nothing about
      # the harness and broke the build; --omit=optional keeps the job to what it actually tests and
      # leaves local runs free to install every subject.
      - run: npm ci --omit=optional
      - name: probe the reference memory server
        run: |
          python harness.py --cmd="node node_modules/@modelcontextprotocol/server-memory/dist/index.js" \
            --json=report.json --expect=expected.json || true
          cat report.json
      - name: the positive control must pass every probe
        run: |
          python harness.py --adapter=control \
            --cmd="python control/memory_server.py" --expect=expected-control.json

      # A PIN IS A REGRESSION DETECTOR, NOT AN ALL-PASS ASSERTION. retained is pinned with one known
      # failure: a record from another tool with no seq field makes it refuse every later write, so
      # foreign_record is FAIL. It was previously pinned PASS because the client swallowed the isError
      # flag and counted a refusal as an acknowledgement. The pin now records what the subject does.
      - name: probe retained (pinned, including its one known refusal)
        run: |
          git clone --depth 1 https://github.com/arm00pv/retained /tmp/retained
          python harness.py --adapter=retained --cmd="python /tmp/retained/retained.py" \
            --expect=expected-retained.json --per-writer=25

      # THE FRONT DOOR IS --adapter=auto AND NOTHING HERE EXERCISED IT. A user points this at a server they
      # have not written an adapter for: the binding is discovered from the tools the server publishes, built
      # from their own JSON schemas, and PROVEN by round-trip before a probe runs. If that path rots, this
      # repository still works for its own eleven subjects and for nobody else's.
      - name: the auto-detecting adapter must work, since it is how anybody else runs this
        run: |
          python harness.py --adapter=auto \
            --cmd="node node_modules/@modelcontextprotocol/server-memory/dist/index.js" \
            --json=/tmp/auto.json
          python - <<'PY'
          import json, sys
          rows = {r['probe']: r['verdict'] for r in json.load(open('/tmp/auto.json'))['probes']}
          print(rows)
          bad = sorted(k for k, v in rows.items() if v == 'FAIL')
          if bad:
              sys.exit('the auto adapter reached a FAIL: %s' % bad)
          for probe in ('ack_readback', 'restart', 'findable'):
              if rows.get(probe) != 'PASS':
                  sys.exit('the binding the auto adapter proved does not hold: %s' % rows)
          PY

      - name: verdicts must match the pinned expectation
        run: |
          python - <<'PY'
          import json, sys
          want = json.load(open('expected.json'))
          got = {r['probe']: r['verdict'] for r in json.load(open('report.json'))['probes']}
          drift = {k: (v, got.get(k)) for k, v in want.items() if got.get(k) != v}
          print('drift:', drift or 'none')
          sys.exit(1 if drift else 0)
          PY